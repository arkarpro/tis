<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>The Insights Solution | Data Strategy & Executive Training</title>
  <link href="media_folder/branding/logo.jpg" rel="icon" type="image/jpg" onerror="this.href='Media_Files/logo.jpg'"/>
  <meta content="The Insights Solution" property="og:title"/>
  <meta content="Data Strategy, Modern Excel, Power Query, Power BI & SQL Executive Training." property="og:description"/>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding-top: 104px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Universal Content Card Media Display 16:9 */
    .media-16-9 {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #f4f4f4;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-16-9 img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Content Line Clamp */
    .clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .clamp-none {
      display: block !important;
      -webkit-line-clamp: unset !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="text-gray-800 antialiased selection:bg-blue-600 selection:text-white flex flex-col min-h-screen">

  <!-- 1. Navigation Placeholder -->
  <header id="nav-placeholder" class="fixed top-0 left-0 w-full z-50"></header>

  <!-- 2. Dynamic Ad Banner Placeholder (Google Sheet Integration) -->
  <div id="ad-banner-placeholder"></div>

  <!-- 3. Dynamic Page Content Frame (SPA Loader) -->
  <main id="main-content" class="flex-1 container mx-auto max-w-7xl px-4 py-6">
    <div id="loading-spinner" class="flex flex-col items-center justify-center py-28 w-full">
      <div class="w-10 h-10 border-4 border-gray-100 border-t-blue-600 rounded-full animate-spin mb-4"></div>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">TIS Learning Platform ကို ဖွင့်လှစ်နေပါသည်...</p>
    </div>
  </main>

  <!-- 4. Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- 5. Floating Action Icons Placeholder (Viber / Phone) -->
  <div id="floating-icons-placeholder"></div>

  <!-- 6. Login Modal Placeholder -->
  <div id="login-placeholder"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
