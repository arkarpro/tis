<!-- Login Modal Component -->
<div id="loginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-gray-100 relative">
    <button onclick="closeLoginModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">&times;</button>
    <div class="text-center mb-6">
      <img src="Media_Files/branding/logo1.jpg" alt="Logo" class="w-14 h-14 rounded-full mx-auto mb-2 border-2 border-blue-500" onerror="this.src='Media_Files/logo.jpg'">
      <h3 class="text-xl font-black text-slate-800">TIS Account Login</h3>
      <p class="text-xs text-gray-500 mt-1">သင်၏ သင်ယူမှုမှတ်တမ်းနှင့် Mock Test ရလဒ်များကို ရယူပါ</p>
    </div>
    <div class="space-y-4">
      <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-gray-300 rounded-xl hover:bg-gray-50 font-bold text-xs text-gray-700 shadow-sm transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Google ဖြင့် ဝင်ရောက်မည်</span>
      </button>
      <div class="flex items-center my-3">
        <div class="flex-1 border-t border-gray-200"></div>
        <span class="px-3 text-gray-400 text-xs font-semibold">သို့မဟုတ်</span>
        <div class="flex-1 border-t border-gray-200"></div>
      </div>
      <input type="email" id="login-email" placeholder="အီးမေးလ် လိပ်စာ" class="w-full px-4 py-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-blue-500 outline-none">
      <input type="password" id="login-password" placeholder="စကားဝှက် (Password)" class="w-full px-4 py-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-blue-500 outline-none">
      <button onclick="handleEmailLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs rounded-xl shadow-md transition">ဝင်ရောက်မည် (Sign In)</button>
    </div>
  </div>
</div>
